  <rect x="431" y="57" width="240" height="526" rx="32" fill="url(#tScreen)" stroke="#2e3d4b" stroke-width="1"/>
  <rect x="514" y="68" width="74" height="22" rx="11" fill="#05070d"/>

  <g clip-path="url(#clip-t1)">
    <text x="449" y="82" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#e8e6ec">9:41</text>
    <g fill="#e8e6ec" opacity="0.9">
