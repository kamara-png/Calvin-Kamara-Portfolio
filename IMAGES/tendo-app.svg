<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Tendo habit, todo and streak tracker app shown on two phones">
  <defs>
    <linearGradient id="tBG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141d26"/>
      <stop offset="1" stop-color="#1d2f3f"/>
    </linearGradient>
    <radialGradient id="tGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#70b9ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#70b9ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4b5c"/>
      <stop offset="0.5" stop-color="#223243"/>
      <stop offset="1" stop-color="#17222d"/>
    </linearGradient>
    <linearGradient id="tScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="1" stop-color="#18242f"/>
    </linearGradient>

    <g id="t-check" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="7.5"/>
      <path d="M-3.8 0 L-0.9 3 L3.9 -2.6"/>
    </g>
    <g id="t-ring" fill="none" stroke-width="1.8">
      <circle cx="0" cy="0" r="7.5"/>
    </g>
    <g id="t-dot" fill="none" stroke-width="1.8">
      <circle cx="0" cy="0" r="5"/>
    </g>
    <g id="t-dot-fill"><circle cx="0" cy="0" r="5"/></g>
    <g id="t-alarm" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="6"/>
      <path d="M0 -3.4 V0 L2.4 1.2"/>
      <path d="M-6.6 -6.4 L-4.6 -4.4 M6.6 -6.4 L4.6 -4.4"/>
    </g>
    <g id="t-edit" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6 6 v-3 l8 -8 3 3 -8 8 z"/>
      <path d="M1 -5 l3 3"/>
    </g>
    <g id="t-trash" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6 -3.5 H6 M-4 -3.5 v8 a1 1 0 0 0 1 1 h6 a1 1 0 0 0 1 -1 v-8 M-2 -3.5 v-2 h4 v2"/>
    </g>
    <g id="t-plus" fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M0 -6 V6 M-6 0 H6"/>
    </g>
    <g id="t-flame" fill="none" stroke-width="1.5" stroke-linejoin="round">
      <path d="M0 -8 C -3 -4 -6 -2 -6 2 A6 6 0 0 0 6 2 C 6 -1 3 -3 2 -6 C 2 -3 0 -2 0 0 C -1.2 -2 -1.2 -5 0 -8 Z"/>
    </g>
    <g id="t-doc" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-6" y="-7.5" width="12" height="15" rx="2.5"/>
      <line x1="-3" y1="-3" x2="3" y2="-3"/>
      <line x1="-3" y1="0.5" x2="3" y2="0.5"/>
      <line x1="-3" y1="4" x2="1" y2="4"/>
    </g>
    <g id="t-podium" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6 5 v-4 M0 5 v-10 M6 5 v-6"/>
    </g>
    <g id="t-gear" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="2.6"/>
      <path d="M0 -7 v2 M0 7 v-2 M7 0 h-2 M-7 0 h2 M5 -5 l-1.4 1.4 M-5 5 l1.4 -1.4 M5 5 l-1.4 -1.4 M-5 -5 l1.4 1.4"/>
    </g>

    <clipPath id="clip-t1"><rect x="431" y="57" width="240" height="526" rx="32"/></clipPath>
    <clipPath id="clip-t2"><rect x="929" y="57" width="240" height="526" rx="32"/></clipPath>
