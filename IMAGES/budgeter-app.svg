    <text x="459" y="166" font-family="Inter, sans-serif" font-size="23" font-weight="800" fill="#F1F5F9">KSh 42,350</text>
    <line x1="459" y1="177" x2="643" y2="177" stroke="#243149"/>
    <g font-family="Inter, sans-serif" text-anchor="middle">
      <text x="480" y="196" font-size="11.5" font-weight="800" fill="#34D399">KSh 85,000</text>
      <text x="551" y="196" font-size="11.5" font-weight="800" fill="#F1F5F9">+42,650</text>
      <text x="622" y="196" font-size="11.5" font-weight="800" fill="#818CF8">KSh 17,650</text>
      <text x="480" y="210" font-size="9" fill="#94A3B8">Income</text>
      <text x="551" y="210" font-size="9" fill="#94A3B8">Net</text>
      <text x="622" y="210" font-size="9" fill="#94A3B8">Left</text>
