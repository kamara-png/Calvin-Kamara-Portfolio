      <rect x="459" y="314" width="180" height="5" rx="2.5" fill="#F59E0B"/>

      <text x="459" y="338" font-size="9.5" font-weight="600" fill="#F1F5F9">Transport</text>
      <text x="643" y="338" text-anchor="end" font-size="9" fill="#94A3B8">KSh 8,200 / 12,000</text>
