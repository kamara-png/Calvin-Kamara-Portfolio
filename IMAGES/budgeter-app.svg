      <text x="959" y="571" fill="#64748B">Budgeter</text>
      <use href="#ic-card" transform="translate(1019,551)" stroke="#64748B"/>
      <text x="1019" y="571" fill="#64748B">History</text>
      <use href="#ic-pie" transform="translate(1079,551)" stroke="#818CF8"/>
      <text x="1079" y="571" fill="#818CF8">Stats</text>
      <use href="#ic-gear" transform="translate(1139,551)" stroke="#64748B"/>
