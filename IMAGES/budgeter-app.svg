      <text x="971" y="417" font-size="9.5" font-weight="600" fill="#F1F5F9">Food &amp; Drinks</text>
      <text x="1107" y="417" text-anchor="end" font-size="9.5" font-weight="700" fill="#F1F5F9">KSh 15,800</text>
      <text x="1141" y="417" text-anchor="end" font-size="9" fill="#64748B">37%</text>

      <circle cx="959" cy="434" r="4" fill="#3B82F6"/>
      <text x="971" y="437" font-size="9.5" font-weight="600" fill="#F1F5F9">Transport</text>
      <text x="1107" y="437" text-anchor="end" font-size="9.5" font-weight="700" fill="#F1F5F9">KSh 9,200</text>
      <text x="1141" y="437" text-anchor="end" font-size="9" fill="#64748B">22%</text>

      <circle cx="959" cy="454" r="4" fill="#EF4444"/>
      <text x="971" y="457" font-size="9.5" font-weight="600" fill="#F1F5F9">Shopping</text>
      <text x="1107" y="457" text-anchor="end" font-size="9.5" font-weight="700" fill="#F1F5F9">KSh 7,400</text>
      <text x="1141" y="457" text-anchor="end" font-size="9" fill="#64748B">17%</text>

      <circle cx="959" cy="474" r="4" fill="#8B5CF6"/>
