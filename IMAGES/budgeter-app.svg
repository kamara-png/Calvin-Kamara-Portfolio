  <rect x="431" y="57" width="240" height="526" rx="32" fill="url(#bScreen)" stroke="#243149" stroke-width="1"/>
  <rect x="514" y="68" width="74" height="22" rx="11" fill="#05070d"/>

  <g clip-path="url(#clip-b1)">
