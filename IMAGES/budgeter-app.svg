  <!-- ================= PHONE 2 : Stats ================= -->
  <rect x="918" y="46" width="262" height="548" rx="44" fill="url(#bFrame)" stroke="#3a4766" stroke-width="1.5"/>
  <rect x="929" y="57" width="240" height="526" rx="32" fill="url(#bScreen)" stroke="#243149" stroke-width="1"/>
  <rect x="1012" y="68" width="74" height="22" rx="11" fill="#05070d"/>

