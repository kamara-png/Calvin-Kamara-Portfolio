    <!-- recent activity -->
    <text x="459" y="429" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Recent activity</text>
    <rect x="445" y="437" width="212" height="84" rx="14" fill="#151D2E" stroke="#243149" stroke-width="1"/>
    <g font-family="Inter, sans-serif">
      <circle cx="458" cy="451" r="8" fill="#F59E0B" opacity="0.9"/>
      <text x="472" y="454" font-size="9.5" fill="#F1F5F9">Food &amp; Drinks</text>
      <text x="643" y="454" text-anchor="end" font-size="9.5" font-weight="700" fill="#F87171">-KSh 1,200</text>

      <circle cx="458" cy="479" r="8" fill="#3B82F6" opacity="0.9"/>
      <text x="472" y="482" font-size="9.5" fill="#F1F5F9">Transport</text>
      <text x="643" y="482" text-anchor="end" font-size="9.5" font-weight="700" fill="#F87171">-KSh 350</text>

      <circle cx="458" cy="507" r="8" fill="#10B981" opacity="0.9"/>
