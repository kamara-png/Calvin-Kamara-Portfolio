    <text x="449" y="82" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#F1F5F9">9:41</text>
    <g fill="#F1F5F9" opacity="0.9">
      <rect x="631" y="74" width="3" height="7" rx="0.8"/>
      <rect x="636" y="72" width="3" height="9" rx="0.8"/>
      <rect x="641" y="70" width="3" height="11" rx="0.8"/>
      <rect x="650" y="72" width="14" height="8" rx="2" fill="none" stroke="#F1F5F9" stroke-width="1"/>
      <rect x="652" y="74" width="8" height="4" rx="1"/>
    </g>

    <!-- header -->
    <rect x="511" y="96" width="15" height="15" rx="4.5" fill="#818CF8"/>
    <text x="533" y="108" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#F1F5F9">Budgeter</text>
    <use href="#ic-calc" transform="translate(650,103)" stroke="#94A3B8"/>

    <!-- summary card -->
