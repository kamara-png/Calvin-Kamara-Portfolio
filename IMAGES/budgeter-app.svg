    <line x1="515" y1="186" x2="515" y2="214" stroke="#243149"/>
    <line x1="586" y1="186" x2="586" y2="214" stroke="#243149"/>

    <!-- monthly budget -->
    <text x="459" y="251" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Monthly budget</text>
