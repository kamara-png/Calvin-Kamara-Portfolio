    <g transform="rotate(-90 1049 356)">
      <circle cx="1049" cy="356" r="38" fill="none" stroke="#1B2437" stroke-width="14"/>
      <circle cx="1049" cy="356" r="38" fill="none" stroke="#F59E0B" stroke-width="14" stroke-dasharray="88.3 150.5"/>
      <circle cx="1049" cy="356" r="38" fill="none" stroke="#3B82F6" stroke-width="14" stroke-dasharray="52.5 186.3" transform="rotate(133.2 1049 356)"/>
      <circle cx="1049" cy="356" r="38" fill="none" stroke="#EF4444" stroke-width="14" stroke-dasharray="40.6 198.2" transform="rotate(212.4 1049 356)"/>
      <circle cx="1049" cy="356" r="38" fill="none" stroke="#8B5CF6" stroke-width="14" stroke-dasharray="31.0 207.8" transform="rotate(273.6 1049 356)"/>
      <circle cx="1049" cy="356" r="38" fill="none" stroke="#EC4899" stroke-width="14" stroke-dasharray="26.3 212.5" transform="rotate(320.4 1049 356)"/>
    </g>
    <text x="1049" y="353" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#F1F5F9">42.3K</text>
    <text x="1049" y="365" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" fill="#94A3B8">spent</text>

    <g font-family="Inter, sans-serif">
