    <g>
      <rect x="961" y="556" width="18" height="18" rx="4" fill="#818CF8"/>
      <rect x="993" y="562" width="18" height="12" rx="4" fill="#818CF8" opacity="0.75"/>
      <rect x="1025" y="540" width="18" height="34" rx="4" fill="#818CF8" opacity="0.85"/>
      <rect x="1057" y="552" width="18" height="22" rx="4" fill="#818CF8" opacity="0.85"/>
      <rect x="1089" y="534" width="18" height="40" rx="4" fill="#818CF8"/>
      <rect x="1121" y="558" width="18" height="16" rx="4" fill="#818CF8" opacity="0.75"/>
