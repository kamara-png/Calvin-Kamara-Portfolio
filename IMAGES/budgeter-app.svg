<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Budgeter expense tracker app shown on two phones">
  <defs>
    <linearGradient id="bBG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#151F3A"/>
    </linearGradient>
    <radialGradient id="bGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4766"/>
      <stop offset="0.5" stop-color="#1c2740"/>
      <stop offset="1" stop-color="#131c30"/>
    </linearGradient>
    <linearGradient id="bScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0d1729"/>
    </linearGradient>

    <g id="ic-wallet" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-6" width="16" height="12" rx="3"/>
      <path d="M3 -1 h5 M8 -1 a1.6 1.6 0 0 1 0 2 H3"/>
    </g>
    <g id="ic-card" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-5.5" width="16" height="11" rx="2.5"/>
      <line x1="-8" y1="-1.5" x2="8" y2="-1.5"/>
    </g>
    <g id="ic-pie" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="7"/>
      <path d="M0 0 L0 -7 M0 0 L6 3.5"/>
    </g>
    <g id="ic-gear" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="2.6"/>
      <path d="M0 -7 v2 M0 7 v-2 M7 0 h-2 M-7 0 h2 M5 -5 l-1.4 1.4 M-5 5 l1.4 -1.4 M5 5 l-1.4 -1.4 M-5 -5 l1.4 1.4"/>
    </g>
    <g id="ic-calc" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-6" y="-8" width="12" height="16" rx="2.5"/>
      <line x1="-3" y1="-4.5" x2="3" y2="-4.5"/>
      <circle cx="-3" cy="0.5" r="0.7"/>
      <circle cx="0" cy="0.5" r="0.7"/>
      <circle cx="3" cy="0.5" r="0.7"/>
      <circle cx="-3" cy="4" r="0.7"/>
      <circle cx="0" cy="4" r="0.7"/>
      <circle cx="3" cy="4" r="0.7"/>
    </g>
    <g id="ic-chev-l" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.4 -5 L-2.6 0 L2.4 5"/>
    </g>
    <g id="ic-chev-r" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-2.4 -5 L2.6 0 L-2.4 5"/>
    </g>

    <clipPath id="clip-b1"><rect x="431" y="57" width="240" height="526" rx="32"/></clipPath>
    <clipPath id="clip-b2"><rect x="929" y="57" width="240" height="526" rx="32"/></clipPath>
  </defs>

  <rect width="1600" height="640" fill="url(#bBG)"/>
  <ellipse cx="800" cy="330" rx="640" ry="360" fill="url(#bGlow)"/>
  <g opacity="0.16" fill="#818CF8">
    <circle cx="150" cy="120" r="2"/><circle cx="280" cy="500" r="2"/><circle cx="1420" cy="150" r="2"/>
    <circle cx="1320" cy="520" r="2"/><circle cx="760" cy="70" r="2"/><circle cx="900" cy="610" r="2"/>
  </g>

